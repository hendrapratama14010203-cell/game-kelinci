<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Kebun Timun</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #eef4e8 0%, #f6f9f3 100%);
    min-height: 100vh;
    padding: 24px 16px 60px;
    color: #223018;
  }
  .container { max-width: 1000px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 22px; }
  .header .emoji { font-size: 38px; }
  .header h1 { font-size: 22px; color: #2d5a1f; margin-top: 6px; font-weight: 700; }
  .header p { font-size: 13px; color: #6b7d5f; margin-top: 4px; }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .toolbar button, .toolbar a {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: white;
    color: #2d5a1f;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(45,90,31,0.08);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .toolbar .primary { background: linear-gradient(135deg, #5a9c3d, #3d6b2c); color: white; }

  #map {
    height: 340px;
    border-radius: 16px;
    margin-bottom: 22px;
    box-shadow: 0 4px 20px rgba(45,90,31,0.1);
    border: 1px solid #e2ebda;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: #2d5a1f;
    margin: 22px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Folder grid */
  .folder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .folder {
    background: white;
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(45,90,31,0.08);
    border: 1px solid #eef3ea;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .folder:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(45,90,31,0.15); }
  .folder.active { border-color: #5a9c3d; background: #f4faf0; }
  .folder .icon { font-size: 34px; }
  .folder .tanggal { font-weight: 700; font-size: 13.5px; margin-top: 8px; color: #2d3b28; }
  .folder .jumlah { font-size: 11.5px; color: #7a8a6f; margin-top: 2px; }

  /* Photo grid inside a folder */
  .photo-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .photo-grid.open { display: grid; }

  .card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(45,90,31,0.08);
    border: 1px solid #eef3ea;
  }
  .card img { width: 100%; height: 170px; object-fit: cover; display: block; cursor: pointer; }
  .card-body { padding: 12px 14px; font-size: 12.5px; }
  .card-body .waktu { color: #8a9a80; margin-bottom: 4px; font-weight: 600; }
  .card-body .lokasi { color: #3d6b2c; margin-bottom: 4px; }
  .card-body .ket { color: #445; margin-top: 4px; }
  .card-actions {
    display: flex;
    gap: 8px;
    padding: 0 14px 14px;
  }
  .card-actions button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-download { background: #eaf2ff; color: #2563eb; }
  .btn-hapus { background: #fdeaea; color: #c0392b; }
  .card-actions button:active { transform: scale(0.97); }

  .empty {
    text-align: center;
    color: #8a9a80;
    margin-top: 40px;
    font-size: 14px;
  }

  /* lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,15,8,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 10px; }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    color: white;
    font-size: 30px;
    cursor: pointer;
    background: none; border: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="emoji">📊</div>
    <h1>Dashboard Monitoring game kelinci</h1>
    <p>Semua tersimpan</p>
  </div>

  <div class="toolbar">
    <button class="primary" onclick="loadData()">🔄 Refresh Data</button>
    <a href="/index.html">untuk mian lagi</a>
  </div>

  <div id="map"></div>

  <div class="section-title">🗂️ Folder Berdasarkan Tanggal</div>
  <div class="folder-grid" id="folderGrid"></div>

  <div id="photoContainer"></div>

  <p class="empty" id="empty" style="display:none;">Belum ada data monitoring.</p>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="Foto besar" />
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL = "/api/monitoring";
const SERVER_BASE = "";

let map = L.map("map").setView([-0.5, 117], 5);

// Layer satelit (Esri World Imagery)
const satelit = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics" }
).addTo(map);

// Layer label jalan/nama tempat di atas citra satelit
const label = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  { attribution: "" }
).addTo(map);

let markers = [];
let allData = [];
let activeFolder = null;

function formatTanggal(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function dateKey(dateStr) {
  const d = new Date(dateStr);
  return d.toISOString().slice(0, 10); // YYYY-MM-DD sebagai kunci folder
}

async function loadData() {
  try {
    const res = await fetch(API_URL);
    allData = await res.json();

    const empty = document.getElementById("empty");
    markers.forEach((m) => map.removeLayer(m));
    markers = [];

    if (allData.length === 0) {
      empty.style.display = "block";
      document.getElementById("folderGrid").innerHTML = "";
      document.getElementById("photoContainer").innerHTML = "";
      return;
    }
    empty.style.display = "none";

    // Tambahkan semua marker ke peta
    allData.forEach((item) => {
      const waktu = new Date(item.waktu).toLocaleString("id-ID");
      const marker = L.marker([item.latitude, item.longitude]).addTo(map);
      marker.bindPopup(`<b>${waktu}</b><br>${item.keterangan || "Tidak ada keterangan"}`);
      markers.push(marker);
    });
    map.setView([allData[0].latitude, allData[0].longitude], 14);

    renderFolders();
  } catch (err) {
    console.error("Gagal memuat data:", err);
    document.getElementById("empty").textContent = "❌ Gagal terhubung ke server.";
    document.getElementById("empty").style.display = "block";
  }
}

function renderFolders() {
  // Kelompokkan data berdasarkan tanggal
  const grup = {};
  allData.forEach((item) => {
    const key = dateKey(item.waktu);
    if (!grup[key]) grup[key] = [];
    grup[key].push(item);
  });

  const folderGrid = document.getElementById("folderGrid");
  folderGrid.innerHTML = "";

  Object.keys(grup)
    .sort((a, b) => b.localeCompare(a)) // terbaru dulu
    .forEach((key) => {
      const items = grup[key];
      const folderEl = document.createElement("div");
      folderEl.className = "folder" + (activeFolder === key ? " active" : "");
      folderEl.innerHTML = `
        <div class="icon">📁</div>
        <div class="tanggal">${formatTanggal(items[0].waktu)}</div>
        <div class="jumlah">${items.length} foto</div>
      `;
      folderEl.addEventListener("click", () => toggleFolder(key, items));
      folderGrid.appendChild(folderEl);
    });

  // Kalau ada folder yang sedang aktif, render ulang isinya
  if (activeFolder && grup[activeFolder]) {
    renderPhotos(activeFolder, grup[activeFolder]);
  }
}

function toggleFolder(key, items) {
  if (activeFolder === key) {
    activeFolder = null;
    document.getElementById("photoContainer").innerHTML = "";
    renderFolders();
    return;
  }
  activeFolder = key;
  renderFolders();
  renderPhotos(key, items);
}

function renderPhotos(key, items) {
  const container = document.getElementById("photoContainer");
  const grid = document.createElement("div");
  grid.className = "photo-grid open";

  items.forEach((item) => {
    const waktu = new Date(item.waktu).toLocaleString("id-ID");
    const fotoUrl = SERVER_BASE + item.fotoPath;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${fotoUrl}" alt="Foto kebun" onclick="openLightbox('${fotoUrl}')" />
      <div class="card-body">
        <div class="waktu">🕐 ${waktu}</div>
        <div class="lokasi">📍 ${item.latitude.toFixed(5)}, ${item.longitude.toFixed(5)}</div>
        ${item.keterangan ? `<div class="ket">${item.keterangan}</div>` : ""}
      </div>
      <div class="card-actions">
        <button class="btn-download" onclick="downloadFoto('${fotoUrl}', '${item._id}')">⬇️ Download</button>
        <button class="btn-hapus" onclick="hapusData('${item._id}')">🗑️ Hapus</button>
      </div>
    `;
    grid.appendChild(card);
  });

  container.innerHTML = "";
  container.appendChild(grid);
}

function openLightbox(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

// Download foto langsung ke perangkat
async function downloadFoto(url, id) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `kebun-${id}.jpg`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    alert("Gagal download foto: " + err.message);
  }
}

// Hapus data (foto + metadata) dengan konfirmasi
async function hapusData(id) {
  const yakin = confirm("Yakin ingin menghapus foto & data ini? Tindakan ini tidak bisa dibatalkan.");
  if (!yakin) return;

  try {
    const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
    if (res.ok) {
      loadData(); // muat ulang data setelah berhasil hapus
    } else {
      const result = await res.json();
      alert("Gagal menghapus: " + (result.error || "Terjadi kesalahan"));
    }
  } catch (err) {
    alert("Gagal konek ke server: " + err.message);
  }
}

loadData();
</script>
</body>
</html>
